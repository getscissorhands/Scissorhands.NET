version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "vnext"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "vnext"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/test/browser"
    target-branch: "vnext"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
