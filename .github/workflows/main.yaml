name: Build, Test and Publish

on:
  push:
    branches:
    - main
    - vnext
    - feat/*
    - hotfix/*
    tags:
      - 'v*'
  pull_request:
    branches:
    - main
    - vnext

jobs:
  build_and_test:
    name: Build and test packages
    strategy:
      matrix:
        os: [ 'windows-latest', 'macos-latest', 'ubuntu-latest' ]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'

    - name: Check package version
      id: version
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        if ($($env:GITHUB_REF).StartsWith('refs/tags/v') -eq $false) {
          $version = "1.0.0"
        }

        "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Clear NuGet local cache
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        dotnet nuget locals all --clear

    - name: Restore NuGet packages
      shell: pwsh
      run: |
        dotnet restore

    - name: Build solution
      shell: pwsh
      run: |
        dotnet build -c Release -p:Version=${{ steps.version.outputs.value }}

    - name: Run unit tests
      shell: pwsh
      run: |
        dotnet test --solution ./ScissorHands.slnx -c Release --no-build --verbosity normal

    - name: Pack NuGet package
      if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest' }}
      shell: bash
      run: |
        dotnet pack ./src/ScissorHands.Core -c Release -o published --include-symbols -p:Version=${{ steps.version.outputs.value }}
        dotnet pack ./src/ScissorHands.Plugin -c Release -o published --include-symbols -p:Version=${{ steps.version.outputs.value }}
        dotnet pack ./src/ScissorHands.Theme -c Release -o published --include-symbols -p:Version=${{ steps.version.outputs.value }}
        dotnet pack ./src/ScissorHands.Web -c Release -o published --include-symbols -p:Version=${{ steps.version.outputs.value }}

    - name: Upload Artifact
      if: ${{ startsWith(github.ref, 'refs/tags/v') && matrix.os == 'ubuntu-latest' }}
      uses: actions/upload-artifact@v5
      with:
        name: artifacts
        path: ./published/

  browser_acceptance:
    name: Page navigation browser acceptance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v7

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: test/browser/package-lock.json

    - name: Restore sample dependencies
      run: dotnet restore ./samples/ScissorHands.Sample/ScissorHands.Sample.csproj

    - name: Install browser test dependencies
      working-directory: test/browser
      run: npm ci

    - name: Install browser engines
      working-directory: test/browser
      run: npx playwright install --with-deps chromium firefox webkit

    - name: Run component acceptance checks
      working-directory: test/browser
      run: npm test

    - name: Upload browser acceptance results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: page-navigation-browser-results
        path: test/browser/test-results/

  release:
    name: Release packages
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs:
    - build_and_test

    runs-on: ubuntu-latest
    environment: nuget-release

    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
    - name: Check package version
      id: version
      shell: pwsh
      run: |
        $version = $env:GITHUB_REF -replace 'refs/tags/v', ''
        if ($($env:GITHUB_REF).StartsWith('refs/tags/v') -eq $false) {
          $version = "1.0.0"
        }

        "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Download Artifact
      uses: actions/download-artifact@v8
      with:
        name: artifacts
        path: ./published

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.x'

    - name: Create Release to GitHub
      uses: softprops/action-gh-release@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        tag_name: "v${{ steps.version.outputs.value }}"
        files: ./published/*.*
        generate_release_notes: true

    - name: Release to GitHub Package Registry
      shell: bash
      run: |
        for package in ./published/*.nupkg; do
          if [[ "$package" == *.snupkg ]]; then
            continue
          fi

          dotnet nuget push "$package" \
            --source "https://nuget.pkg.github.com/getscissorhands/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
        done

    - name: NuGet login
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Release to NuGet.org
      shell: bash
      run: |
        for package in ./published/*.nupkg; do
          if [[ "$package" == *.snupkg ]]; then
            continue
          fi

          dotnet nuget push "$package" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
        done
